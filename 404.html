<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Заказной</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#071f10;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#fff;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem;text-align:center;}
.logo h1{font-family:Georgia,'Times New Roman',serif;font-size:2.4rem;letter-spacing:4px;color:#f0c96a;text-shadow:0 0 40px rgba(212,168,67,.4);}
.logo p{font-size:.65rem;letter-spacing:4px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-top:.4rem;}
.spinner{width:34px;height:34px;border:3px solid rgba(212,168,67,.15);border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.choices{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;}
.choices a{background:rgba(255,255,255,.06);border:1px solid rgba(212,168,67,.25);color:#f0c96a;text-decoration:none;padding:.6rem 1.2rem;border-radius:10px;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;transition:all .2s;}
.choices a:hover{background:rgba(212,168,67,.15);}
.hint{font-size:.68rem;color:rgba(255,255,255,.28);max-width:320px;line-height:1.5;}
</style>
<script>
(function(){
  // GitHub Pages project sites live under /<repo>/. Determine that base once.
  // If an old Service Worker served this fallback at /pc/ or /mobile/, cut that suffix off.
  function appBase(){
    var p = location.pathname || '/';
    var m = p.match(/^(.*?)\/(?:pc|mobile)(?:\/|$)/i);
    if(m) return (m[1] || '') + '/';
    return p.replace(/\/+$/, '') + '/';
  }
  function pathVersion(){
    var m = (location.pathname || '').match(/\/(pc|mobile)(?:\/|$)/i);
    return m ? m[1].toLowerCase() : '';
  }
  var base = appBase();
  var hereVersion = pathVersion();

  function go(v){
    var target = base + v + '/';
    if(location.pathname === target) return; // уже на этой версии — не дописываем /pc/pc/
    location.replace(target);
  }

  window.__zakaznoyAppBase = base;
  document.addEventListener('DOMContentLoaded', function(){
    var links = document.querySelectorAll('a[data-version]');
    for(var i=0;i<links.length;i++){
      links[i].href = base + links[i].getAttribute('data-version') + '/';
    }
  });

  // Аварийное восстановление после старого SW: корневая страница открылась по адресу /pc/ или /mobile/.
  var recovered = false;
  try{ recovered = sessionStorage.getItem('zakaznoy_sw_recover') === '1'; }catch(e){}
  if(hereVersion && !recovered && 'serviceWorker' in navigator){
    try{ sessionStorage.setItem('zakaznoy_sw_recover','1'); }catch(e){}
    var clear = Promise.resolve();
    if(window.caches && caches.keys){
      clear = caches.keys().then(function(keys){
        return Promise.all(keys.filter(function(k){ return k.indexOf('zakaznoy-') === 0; }).map(function(k){ return caches.delete(k); }));
      }).catch(function(){});
    }
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }));
      }).catch(function(){}),
      clear
    ]).then(function(){
      location.replace(base + hereVersion + '/?swrecover=1');
    });
    return;
  }

  var params = new URLSearchParams(location.search);
  var forced = params.get('v');
  if (forced === 'pc' || forced === 'mobile') {
    if (forced === 'pc') localStorage.setItem('zakaznoy_v', 'pc');
    else localStorage.setItem('zakaznoy_v', 'mobile');
    go(forced);
    return;
  }
  var saved;
  try { saved = localStorage.getItem('zakaznoy_v'); } catch(e) {}
  if (saved === 'pc' || saved === 'mobile') {
    go(saved);
    return;
  }
  var ua = navigator.userAgent || '';
  var coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || (coarsePointer && touch);
  go(isMobile ? 'mobile' : 'pc');
})();
</script>
</head>
<body>
  <div class="logo">
    <h1>Заказной</h1>
    <p>Загрузка…</p>
  </div>
  <div class="spinner"></div>
  <noscript>
    <div class="choices">
      <a href="pc/" data-version="pc">Десктопная версия</a>
      <a href="mobile/" data-version="mobile">Мобильная версия</a>
    </div>
  </noscript>
  <div class="choices" id="manual" style="display:none">
    <a href="pc/" data-version="pc">Десктопная версия</a>
    <a href="mobile/" data-version="mobile">Мобильная версия</a>
  </div>
  <p class="hint" id="hint" style="display:none">Если игра открылась не в той версии — выберите её вручную</p>
  <script>
    setTimeout(function(){
      document.getElementById('manual').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
    }, 2500);
  </script>
</body>
</html>
