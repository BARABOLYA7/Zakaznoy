<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Заказной</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#071f10;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#fff;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem;text-align:center;}
.logo h1{font-family:Georgia,'Times New Roman',serif;font-size:2.4rem;letter-spacing:4px;color:#f0c96a;text-shadow:0 0 40px rgba(212,168,67,.4);}
.logo p{font-size:.65rem;letter-spacing:4px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-top:.4rem;}
.spinner{width:34px;height:34px;border:3px solid rgba(212,168,67,.15);border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.choices{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;}
.choices a{background:rgba(255,255,255,.06);border:1px solid rgba(212,168,67,.25);color:#f0c96a;text-decoration:none;padding:.6rem 1.2rem;border-radius:10px;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;transition:all .2s;}
.choices a:hover{background:rgba(212,168,67,.15);}
.hint{font-size:.68rem;color:rgba(255,255,255,.28);max-width:320px;line-height:1.5;}
</style>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var forced = params.get('v');
  if (forced === 'pc' || forced === 'mobile') {
    if (forced === 'pc') localStorage.setItem('zakaznoy_v', 'pc');
    else localStorage.setItem('zakaznoy_v', 'mobile');
    location.replace(forced === 'pc' ? 'pc/' : 'mobile/');
    return;
  }
  var saved;
  try { saved = localStorage.getItem('zakaznoy_v'); } catch(e) {}
  if (saved === 'pc' || saved === 'mobile') {
    location.replace(saved + '/');
    return;
  }
  var ua = navigator.userAgent || '';
  var uaData = navigator.userAgentData;
  var mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
  var coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  var isMobile = mobileUA || (coarsePointer && touch);
  location.replace(isMobile ? 'mobile/' : 'pc/');
})();
</script>
</head>
<body>
  <div class="logo">
    <h1>Заказной</h1>
    <p>Загрузка…</p>
  </div>
  <div class="spinner"></div>
  <noscript>
    <div class="choices">
      <a href="pc/">Десктопная версия</a>
      <a href="mobile/">Мобильная версия</a>
    </div>
  </noscript>
  <div class="choices" id="manual" style="display:none">
    <a href="pc/">Десктопная версия</a>
    <a href="mobile/">Мобильная версия</a>
  </div>
  <p class="hint" id="hint" style="display:none">Если игра открылась не в той версии — выберите её вручную</p>
  <script>
    setTimeout(function(){
      document.getElementById('manual').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
    }, 2500);
  </script>
</body>
</html>
